# Generated by White Factory: clean-environment re-run of the WU gates.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - run: "node --test"
      - run: "node --check tip.js"
      - run: "test ! -e package.json || true"
      - run: "node --check app.js"
      - run: "test -f index.html && test -f styles.css"
      - run: "grep -Fq '<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">' index.html"
      - run: "grep -Fq 'aria-live=\"polite\"' index.html"
      - run: "grep -Fq 'inputmode=\"decimal\"' index.html"
      - run: "grep -Fq 'aria-pressed' index.html"
      - run: "node --check e2e/tip-splitter.spec.mjs"
      - run: "grep -Fq 'import { test, expect } from \"@playwright/test\"' e2e/tip-splitter.spec.mjs || grep -Fq \"import { test, expect } from '@playwright/test'\" e2e/tip-splitter.spec.mjs"
      - run: "grep -Fq 'page.goto(' e2e/tip-splitter.spec.mjs"
      - run: "test -f README.md && test -f index.html && test -f styles.css && test -f app.js && test -f tip.js && test -f test/tip.test.js && test -f e2e/tip-splitter.spec.mjs"
      - run: "grep -Fq 'python3 -m http.server' README.md"
      - run: "grep -Fq 'node --test' README.md"
      - run: "grep -Fq 'GitHub Pages' README.md"
      - run: "! grep -R --include='*.html' --include='*.js' -E 'https?://' index.html app.js tip.js"
